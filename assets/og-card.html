<!doctype html>
<!-- Source for assets/og-cover.jpg — screenshot this at exactly 1200x630. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Tiro+Devanagari+Marathi&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
    background:
      radial-gradient(760px 460px at 50% 8%, rgba(255,214,130,.5), transparent 66%),
      linear-gradient(178deg,#3F1808 0%,#6B3110 26%,#94501A 52%,#C58234 76%,#EFDDB4 100%);
    font-family:"Cormorant Garamond",Georgia,serif;color:#FFEDC8}
  .photo{position:absolute;bottom:-8px;height:530px;width:auto;
    filter:drop-shadow(0 12px 26px rgba(30,12,4,.55))}
  .photo.l{left:-26px}
  .photo.r{right:-34px}
  .col{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:20px 300px;z-index:2}
  .dev{font-family:"Tiro Devanagari Marathi",serif;line-height:1.3;
    text-shadow:0 2px 12px rgba(40,18,4,.8)}
  .shlok{font-size:27px;color:#FFE2A0;margin-bottom:8px}
  .morya{font-size:35px;color:#FFF4D6;margin-bottom:18px}
  .rule{width:230px;height:1px;background:linear-gradient(90deg,transparent,#E9C46A,transparent)}
  h1{font-family:"Cinzel",serif;font-weight:400;font-size:66px;line-height:1.04;margin:14px 0 2px;white-space:nowrap;
    background:linear-gradient(180deg,#FFF7DE 8%,#FFDC94 46%,#DFA43A 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 12px rgba(40,18,4,.6))}
  .year{font-family:"Cinzel",serif;font-size:50px;color:#F0C86E;margin-bottom:14px;
    text-shadow:0 3px 12px rgba(40,18,4,.6)}
  .dates{font-size:34px;font-weight:600;letter-spacing:.08em;color:#FFF0C8;margin-top:12px;
    text-shadow:0 2px 10px rgba(40,18,4,.7)}
  .meta{font-size:24px;color:#F6DFB2;margin-top:8px;line-height:1.5;
    text-shadow:0 2px 8px rgba(40,18,4,.7)}
  .host{margin-top:16px;font-size:21px;line-height:1.45;font-weight:600;letter-spacing:.03em;color:#FFE0A8;
    text-shadow:0 2px 8px rgba(40,18,4,.8)}
</style>
</head>
<body>
  <img class="photo l" src="family-elders.webp" alt="" />
  <img class="photo r" src="family-young.webp" alt="" />
  <div class="col">
    <p class="dev shlok">॥ श्री गणेशाय नमः ॥</p>
    <p class="dev morya">गणपती बाप्पा मोरया</p>
    <span class="rule"></span>
    <h1>Ganesh Utsav</h1>
    <p class="year">2026</p>
    <span class="rule"></span>
    <p class="dates">14 &middot; 15 &middot; 16 September</p>
    <p class="meta">Bappa's Darshan &middot; Visarjan Aarti 7:30 PM<br />206 Magnum Plaza, Bhayandar West</p>
    <p class="host">Invited with love by<br />Sarju Sheth, Komal Sheth &amp; Family</p>
  </div>
</body>
</html>
